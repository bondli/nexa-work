<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexa 会话实现流程 · Agent Session Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1100px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Agent Session Flow · Nexa Desktop</p>
    <h1>一次用户会话的完整实现流程：创建 → 延迟启动 → Agentic Loop → 完成</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1200 776" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nexa-session-flow-title nexa-session-flow-desc">
        <title id="nexa-session-flow-title">Nexa Agent 与前端用户会话完整实现序列图</title>
        <desc id="nexa-session-flow-desc">五条生命线：ChatShell UI、preload/IPC 桥、主进程 AgentRuntime、pi-agent-core Loop、LLM/工具/SQLite。UI 经 SESSION_CREATE 创建会话，IPC 响应先行返回并在下一 tick 延迟启动；Runtime 落库用户消息并推送事件，组装 systemPrompt 后驱动 runAgentLoop；LOOP 片段内模型流式增量与工具调用交替，事件经 30ms 节流推回 UI；循环结束后助手消息落库，会话置为 completed 并后台触发每 5 轮一次的记忆提取。</desc>
        <defs>
          <marker id="flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="flow-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
          </marker>
          <marker id="flow-arrow-open-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#bf4520" stroke-width="1.2"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== Lifelines（3,3 虚线） ===== -->
        <line x1="120" y1="120" x2="120" y2="660" stroke="rgba(45,49,66,0.35)" stroke-width="0.8" stroke-dasharray="3,3"/>
        <line x1="360" y1="120" x2="360" y2="660" stroke="rgba(45,49,66,0.35)" stroke-width="0.8" stroke-dasharray="3,3"/>
        <line x1="600" y1="120" x2="600" y2="660" stroke="rgba(45,49,66,0.35)" stroke-width="0.8" stroke-dasharray="3,3"/>
        <line x1="840" y1="120" x2="840" y2="660" stroke="rgba(45,49,66,0.35)" stroke-width="0.8" stroke-dasharray="3,3"/>
        <line x1="1080" y1="120" x2="1080" y2="660" stroke="rgba(45,49,66,0.35)" stroke-width="0.8" stroke-dasharray="3,3"/>

        <!-- ===== Combined fragment: LOOP ===== -->
        <rect x="60" y="362" width="1080" height="186" rx="4"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <rect x="60" y="362" width="58" height="14" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="72" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">LOOP</text>
        <text x="128" y="372" fill="#5a6580" font-size="8" font-family="'Geist','PingFang SC',sans-serif">agentic 多轮 — 流式增量与工具调用交替，直至模型不再发起 tool_call</text>

        <!-- ===== Activation bars（w=8） ===== -->
        <!-- UI：invoke 等待 + 三次事件到达 -->
        <rect x="116" y="154" width="8" height="48" fill="rgba(45,49,66,0.22)"/>
        <rect x="116" y="288" width="8" height="8" fill="rgba(45,49,66,0.22)"/>
        <rect x="116" y="508" width="8" height="8" fill="rgba(45,49,66,0.22)"/>
        <rect x="116" y="620" width="8" height="8" fill="rgba(45,49,66,0.22)"/>
        <!-- IPC：handler 执行 + setTimeout tick -->
        <rect x="356" y="154" width="8" height="48" fill="rgba(45,49,66,0.22)"/>
        <rect x="356" y="236" width="8" height="8" fill="rgba(45,49,66,0.22)"/>
        <!-- Runtime：startSession 到收尾完成 -->
        <rect x="596" y="236" width="8" height="392" fill="rgba(45,49,66,0.22)"/>
        <!-- pi Loop：runAgentLoop 调用到 resolve -->
        <rect x="836" y="334" width="8" height="252" fill="rgba(79,93,117,0.30)"/>
        <!-- LLM/工具/SQLite：流式请求往返 -->
        <rect x="1076" y="400" width="8" height="44" fill="rgba(45,49,66,0.22)"/>

        <!-- ===== Messages ===== -->
        <!-- 1. UI → IPC：创建会话（同步 invoke） -->
        <line x1="124" y1="158" x2="354" y2="158" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
        <!-- 2. IPC → UI：IPC 响应先行返回（虚线实心 = 返回） -->
        <line x1="356" y1="198" x2="126" y2="198" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#flow-arrow)"/>
        <!-- 3. IPC → Runtime：下一 tick 延迟启动（虚线空心 = 异步） -->
        <line x1="364" y1="240" x2="594" y2="240" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#flow-arrow-open)"/>
        <!-- 4. Runtime → UI：message.user 事件 -->
        <line x1="596" y1="292" x2="126" y2="292" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#flow-arrow-open)"/>
        <!-- 5. Runtime → pi：runAgentLoop（同步） -->
        <line x1="604" y1="338" x2="834" y2="338" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
        <!-- 6. pi → LLM/工具：流式请求 / 执行工具（网络 link 色） -->
        <line x1="844" y1="404" x2="1074" y2="404" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#flow-arrow-link)"/>
        <!-- 7. LLM/工具 → pi：delta chunk / 工具结果（异步回流） -->
        <line x1="1076" y1="440" x2="846" y2="440" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#flow-arrow-open)"/>
        <!-- 8. pi → Runtime：onPiEvent 回调 -->
        <line x1="836" y1="476" x2="606" y2="476" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#flow-arrow-open)"/>
        <!-- 9. Runtime → UI：delta / tool 事件流 -->
        <line x1="596" y1="512" x2="126" y2="512" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#flow-arrow-open)"/>
        <!-- 10. pi → Runtime：循环结束 resolve（返回） -->
        <line x1="836" y1="582" x2="606" y2="582" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#flow-arrow)"/>
        <!-- 11. Runtime → UI：done + completed（coral 焦点，异步事件） -->
        <line x1="596" y1="624" x2="126" y2="624" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#flow-arrow-open-accent)"/>

        <!-- ===== Message labels（paper mask + 6-10px 间隙） ===== -->
        <!-- 1 -->
        <rect x="135" y="130" width="210" height="22" rx="2" fill="#f5f5f5"/>
        <text x="240" y="140" fill="#2d3142" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">创建会话 · invoke</text>
        <text x="240" y="151" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">SESSION_CREATE {initialMessage, mode, model}</text>

        <!-- IPC handler 执行注记 -->
        <text x="372" y="180" fill="#5a6580" font-size="8" font-family="'Geist','PingFang SC',sans-serif">db.session.create · 建 workspace 目录 · 注册 setTimeout</text>

        <!-- 2 -->
        <rect x="140" y="170" width="200" height="22" rx="2" fill="#f5f5f5"/>
        <text x="240" y="180" fill="#2d3142" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">IPC 响应先行返回</text>
        <text x="240" y="191" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">{ sessionId, title, mode } · UI 建空壳会话</text>

        <!-- 3 -->
        <rect x="375" y="212" width="210" height="22" rx="2" fill="#f5f5f5"/>
        <text x="480" y="222" fill="#2d3142" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">下一 tick 延迟启动（防首条消息丢失）</text>
        <text x="480" y="233" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">setTimeout(0) → startSession(session, msg)</text>

        <!-- Runtime 注记：用户消息落库 + 起标题 -->
        <text x="612" y="268" fill="#5a6580" font-size="8" font-family="'Geist','PingFang SC',sans-serif">insertUser 写 SQLite · 首条消息异步生成标题</text>

        <!-- 4 -->
        <rect x="247" y="264" width="226" height="22" rx="2" fill="#f5f5f5"/>
        <text x="360" y="274" fill="#2d3142" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">用户消息上屏</text>
        <text x="360" y="285" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">AGENT_EVENT · message.user</text>

        <!-- Runtime 注记：systemPrompt 组装（锚定 Runtime 左侧） -->
        <text x="588" y="316" fill="#5a6580" font-size="8" font-family="'Geist','PingFang SC',sans-serif" text-anchor="end">systemPrompt 组装 · 工具按专家白名单过滤</text>

        <!-- 5 -->
        <rect x="613" y="310" width="214" height="22" rx="2" fill="#f5f5f5"/>
        <text x="720" y="320" fill="#2d3142" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">启动 Agent Loop（同步等待 resolve）</text>
        <text x="720" y="331" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">runAgentLoop(prompts, systemPrompt, tools, model)</text>

        <!-- 6 -->
        <rect x="852" y="376" width="216" height="22" rx="2" fill="#f5f5f5"/>
        <text x="960" y="386" fill="#2d3142" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">请求模型 · 执行工具</text>
        <text x="960" y="397" fill="#2e5aa8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">HTTPS stream · executeTool(read/bash/skill_run/…)</text>

        <!-- 7 -->
        <rect x="854" y="412" width="212" height="22" rx="2" fill="#f5f5f5"/>
        <text x="960" y="422" fill="#2d3142" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">流式 chunk · 工具执行结果</text>
        <text x="960" y="433" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">text_delta · result（仅 throw 判定 isError）</text>

        <!-- 8 -->
        <rect x="615" y="448" width="210" height="22" rx="2" fill="#f5f5f5"/>
        <text x="720" y="458" fill="#2d3142" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">Loop 事件回调</text>
        <text x="720" y="469" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">onPiEvent: message_update · tool_execution_*</text>

        <!-- 9 -->
        <rect x="235" y="484" width="250" height="22" rx="2" fill="#f5f5f5"/>
        <text x="360" y="494" fill="#2d3142" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">流式上屏 · 工具卡更新（tool_calls / messages 落库）</text>
        <text x="360" y="505" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">assistant.delta(30ms) · tool.call · tool.result</text>

        <!-- 10 -->
        <rect x="614" y="554" width="212" height="22" rx="2" fill="#f5f5f5"/>
        <text x="720" y="564" fill="#2d3142" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">循环结束 resolve · 助手消息落库</text>
        <text x="720" y="575" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">message_end → flush(force) · insertAssistant</text>

        <!-- Runtime 收尾注记 -->
        <text x="612" y="608" fill="#5a6580" font-size="8" font-family="'Geist','PingFang SC',sans-serif">updateStatus 落库 · 后台 memory.tick（每 5 轮）</text>

        <!-- 11 coral -->
        <rect x="231" y="596" width="258" height="22" rx="2" fill="#f5f5f5"/>
        <text x="360" y="606" fill="#bf4520" font-size="9" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">助手消息完成 · 会话置为 completed</text>
        <text x="360" y="617" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">message.assistant.done + session.status</text>

        <!-- ===== Lifeline headers（最后绘制，压住生命线顶端） ===== -->
        <!-- L1 UI -->
        <rect x="36" y="68" width="168" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="46" y="76" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="62" y="85" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="120" y="100" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">ChatShell · zustand</text>
        <text x="120" y="113" fill="#4f5d75" font-size="7.5" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">渲染进程 · 事件订阅</text>

        <!-- L2 IPC -->
        <rect x="276" y="68" width="168" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="286" y="76" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="308" y="85" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BRIDGE</text>
        <text x="360" y="100" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">preload / IPC 桥</text>
        <text x="360" y="113" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">window.nexa · ipcMain.handle</text>

        <!-- L3 Runtime（coral 焦点） -->
        <rect x="516" y="68" width="168" height="52" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="526" y="76" width="36" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="544" y="85" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="600" y="100" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">AgentRuntime</text>
        <text x="600" y="113" fill="#4f5d75" font-size="7.5" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">主进程单例 · sessions Map</text>

        <!-- L4 pi Loop -->
        <rect x="756" y="68" width="168" height="52" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="766" y="76" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="786" y="85" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOOP</text>
        <text x="840" y="100" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">pi-agent-core</text>
        <text x="840" y="113" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">runAgentLoop / Continue</text>

        <!-- L5 LLM · 工具 · SQLite -->
        <rect x="996" y="68" width="168" height="52" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="1006" y="76" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="1022" y="85" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="1080" y="100" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">LLM · 工具 · SQLite</text>
        <text x="1080" y="113" fill="#4f5d75" font-size="7.5" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">模型 API · 工具执行 · 本地库</text>

        <!-- ===== Legend ===== -->
        <line x1="32" y1="688" x2="1168" y2="688" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="32" y="710" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <line x1="96" y1="706" x2="124" y2="706" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
        <text x="132" y="710" fill="#4f5d75" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif">同步调用</text>

        <line x1="208" y1="706" x2="236" y2="706" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#flow-arrow)"/>
        <text x="244" y="710" fill="#4f5d75" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif">返回</text>

        <line x1="294" y1="706" x2="322" y2="706" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#flow-arrow-open)"/>
        <text x="330" y="710" fill="#4f5d75" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif">异步事件</text>

        <line x1="402" y1="706" x2="430" y2="706" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#flow-arrow-link)"/>
        <text x="438" y="710" fill="#4f5d75" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif">网络 / 流式</text>

        <line x1="528" y1="706" x2="556" y2="706" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#flow-arrow-open-accent)"/>
        <text x="564" y="710" fill="#4f5d75" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif">完成事件（焦点）</text>

        <rect x="716" y="701" width="8" height="10" fill="rgba(45,49,66,0.22)"/>
