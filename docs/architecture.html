<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexa 系统架构 · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1072px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Nexa Workspace</p>
    <h1>Nexa 系统架构总览</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1072 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nexa-architecture-title nexa-architecture-desc">
        <title id="nexa-architecture-title">Nexa 系统架构总览</title>
        <desc id="nexa-architecture-desc">Nexa 四端协同架构：手机端与 Chrome 插件经云端中继连接 Electron 桌面端，主进程驱动 Agent Runtime 调用大模型并读写本地 SQLite。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== Zones（先画区域） ===== -->
        <!-- Cloud zone -->
        <rect x="360" y="160" width="192" height="136" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="432" y="164" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="456" y="173" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">CLOUD</text>

        <!-- Desktop zone -->
        <rect x="624" y="96" width="256" height="344" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="724" y="100" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="752" y="109" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">ELECTRON</text>

        <!-- ===== Arrows（连线先于节点） ===== -->
        <!-- 手机端 → Relay（两弯肘线，入 Relay 左缘 y=212） -->
        <path d="M 176,148 H 320 Q 328,148 328,156 V 204 Q 328,212 336,212 H 384"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Chrome 插件 → Relay（入 Relay 左缘 y=236） -->
        <path d="M 176,268 H 296 Q 304,268 304,260 V 244 Q 304,236 312,236 H 384"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Relay → 主进程（WS 路由，实线） -->
        <path d="M 528,220 H 592 Q 600,220 600,228 V 260 Q 600,268 608,268 H 648"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 主进程 → Relay（事件回流，虚线） -->
        <path d="M 648,292 H 584 Q 576,292 576,284 V 248 Q 576,240 568,240 H 528"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- 渲染进程 → 主进程（IPC，垂直） -->
        <line x1="752" y1="200" x2="752" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 主进程 → SQLite（垂直） -->
        <line x1="752" y1="312" x2="752" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 主进程 → LLM（HTTP，link 色） -->
        <line x1="856" y1="276" x2="928" y2="276" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- ===== Arrow labels（不透明遮罩 + 6-10px 间隙） ===== -->
        <rect x="228" y="128" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="244" y="138" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WSS</text>

        <rect x="216" y="248" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="232" y="258" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WSS</text>

        <rect x="536" y="200" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="560" y="210" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WS PAIR</text>

        <rect x="594" y="274" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="616" y="284" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVENTS</text>

        <rect x="758" y="212" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="774" y="222" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IPC</text>

        <rect x="758" y="324" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="774" y="334" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQL</text>

        <rect x="870" y="256" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="892" y="266" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

        <!-- ===== Nodes ===== -->
        <!-- 手机端（input） -->
        <rect x="40" y="112" width="136" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="112" width="136" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="120" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="62" y="129" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="108" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC',sans-serif" text-anchor="middle">手机端</text>
        <text x="108" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Expo · Android</text>

        <!-- Chrome 插件（input） -->
        <rect x="40" y="232" width="136" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="232" width="136" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="62" y="249" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="108" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC',sans-serif" text-anchor="middle">Chrome 插件</text>
        <text x="108" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MV3 Extension</text>

        <!-- Nexa Relay（cloud/external） -->
        <rect x="384" y="192" width="144" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="384" y="192" width="144" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="392" y="200" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="410" y="209" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RELAY</text>
        <text x="456" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC',sans-serif" text-anchor="middle">Nexa 中继</text>
        <text x="456" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Express · ws · PM2</text>

        <!-- 渲染进程（backend） -->
        <rect x="648" y="136" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="648" y="136" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="656" y="144" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="668" y="153" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="752" y="170" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC',sans-serif" text-anchor="middle">渲染进程 Renderer</text>
        <text x="752" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">React 19 · shadcn/ui</text>

        <!-- 主进程（focal） -->
        <rect x="648" y="240" width="208" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="648" y="240" width="208" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="656" y="248" width="36" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="674" y="257" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="752" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC',sans-serif" text-anchor="middle">主进程 Main</text>
        <text x="752" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Agent Runtime · Skills · Scheduler</text>

        <!-- SQLite（store） -->
        <rect x="648" y="352" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="648" y="352" width="208" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="656" y="360" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="668" y="369" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="752" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC',sans-serif" text-anchor="middle">本地数据库</text>
        <text x="752" y="402" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sql.js WASM · DELETE 模式</text>

        <!-- LLM 服务（external） -->
        <rect x="928" y="240" width="120" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="928" y="240" width="120" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="936" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="950" y="257" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
        <text x="988" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC',sans-serif" text-anchor="middle">模型服务</text>
        <text x="988" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DeepSeek · OpenAI</text>

        <!-- ===== Legend ===== -->
        <line x1="40" y1="464" x2="1032" y2="464" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="112" y="472" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="132" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif">核心主进程</text>

        <rect x="216" y="472" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="236" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif">界面 / 服务</text>

        <rect x="332" y="472" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="352" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif">本地存储</text>

        <rect x="432" y="472" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="452" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif">云端 / 外部</text>

        <rect x="548" y="472" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="568" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif">客户端入口</text>

        <line x1="656" y1="477" x2="684" y2="477" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="692" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif">WS / HTTP 连接</text>

        <line x1="808" y1="477" x2="836" y2="477" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="844" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist','PingFang SC',sans-serif">事件 / 回流</text>
      </svg>
    </div>
  </div>
</body>
</html>
