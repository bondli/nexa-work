<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Nexa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 300px; font-family: -apple-system, "Segoe UI", sans-serif; background: #0a0a0a; color: #fafafa; padding: 16px; }
    .header { display: flex; align-items: center; gap: 9px; padding-bottom: 14px; border-bottom: 1px solid #1f1f1f; }
    .logo { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .header .name { font-size: 15px; font-weight: 700; }
    .header .sub { font-size: 11px; color: #737373; margin-top: 1px; }
    .device-card { margin: 14px 0; background: #171717; border: 1px solid #262626; border-radius: 12px; padding: 13px 14px; }
    .device-row { display: flex; align-items: center; gap: 9px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .dot.on { background: #22c55e; box-shadow: 0 0 6px rgba(34, 197, 94, 0.6); }
    .dot.mid { background: #eab308; }
    .dot.off { background: #525252; }
    .device-name { font-size: 13px; font-weight: 600; }
    .device-state { font-size: 11px; color: #a3a3a3; margin-left: auto; }
    .device-meta { font-size: 11px; color: #737373; margin-top: 7px; padding-left: 18px; word-break: break-all; }
    button { width: 100%; background: #262626; color: #fafafa; border: 0; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    button:hover { background: #333; }
    .tip { font-size: 11px; color: #525252; text-align: center; margin-top: 10px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo" id="logoMark"></span>
    <div>
      <div class="name">Nexa</div>
      <div class="sub">浏览器插件</div>
    </div>
  </div>

  <div class="device-card">
    <div class="device-row">
      <span id="dot" class="dot off"></span>
      <span id="deviceName" class="device-name">未配对设备</span>
      <span id="deviceState" class="device-state">离线</span>
    </div>
    <div id="deviceMeta" class="device-meta" style="display:none;"></div>
  </div>

  <button id="optionsBtn">配对设置</button>
  <div class="tip">采集文章 / 收藏图片请在网页上<br />使用右键菜单发起</div>

  <script src="popup.js"></script>
</body>
</html>
