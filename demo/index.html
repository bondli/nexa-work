<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexa · 原型预览</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'hsl(0 0% 100%)', foreground: 'hsl(222 47% 11%)',
            muted: 'hsl(210 40% 96%)', 'muted-foreground': 'hsl(215 16% 47%)',
            border: 'hsl(214 32% 91%)', input: 'hsl(214 32% 91%)',
            ring: 'hsl(222 84% 4%)', primary: 'hsl(222 84% 4%)',
            'primary-foreground': 'hsl(210 40% 98%)', secondary: 'hsl(210 40% 96%)',
            'secondary-foreground': 'hsl(222 47% 11%)', accent: 'hsl(210 40% 96%)',
            'accent-foreground': 'hsl(222 47% 11%)', card: 'hsl(0 0% 100%)',
            'card-foreground': 'hsl(222 47% 11%)', destructive: 'hsl(0 84% 60%)',
            success: 'hsl(142 76% 36%)', warning: 'hsl(38 92% 50%)',
            nexa: { DEFAULT: '#6366f1', dark: '#4f46e5' }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'SF Mono', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-feature-settings: "cv11", "ss01"; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: hsl(214 32% 91%); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: hsl(215 16% 47%); }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .step-line { position: relative; }
    .step-line::before { content: ''; position: absolute; left: 7px; top: 20px; bottom: -4px; width: 2px; background: hsl(214 32% 91%); }
    .step-line:last-child::before { display: none; }
    .phone-shadow { box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
    .highlight { background: linear-gradient(120deg, rgba(99,102,241,0.1) 0%, rgba(99,102,241,0.02) 100%); border-left: 3px solid #6366f1; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    /* Nav rail (Codex-style: 56px icon-only navigation, click to switch right area) */
    .rail-btn { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px; transition: all .15s; }
    .rail-btn:hover { background: hsl(210 40% 96%); }
    .rail-btn:focus-visible { outline: 2px solid hsl(222 84% 4%); outline-offset: 2px; }
    .rail-btn.active { background: hsl(210 40% 96%); color: hsl(222 47% 11%); }
  </style>
</head>
<body class="bg-[hsl(0,0%,97%)] text-[hsl(222,47%,11%)] font-sans h-screen overflow-hidden">
<div class="flex h-screen w-screen">
  <!-- LEFT NAV RAIL (78px, Logo at top + icon navigation) -->
  <aside id="nav-rail" class="shrink-0 bg-white border-r border-border flex flex-col items-center" style="width:78px">
    <!-- Logo + traffic light area (64px) -->
    <div class="h-16 w-full shrink-0 flex flex-col items-center justify-end pb-2">
      <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 shrink-0" fill="currentColor" style="margin-top:27px"><path d="M757.333333 842.666667l13.269334 39.850666A42.666667 42.666667 0 0 1 730.154667 938.666667H293.845333a42.666667 42.666667 0 0 1-40.448-56.149334l13.269334-39.850666c10.24-30.72 30.464-56.149333 56.32-73.088A360.576 360.576 0 0 0 490.666667 810.666667h42.666666a361.088 361.088 0 0 0 167.68-41.002667c25.856 16.853333 46.08 42.24 56.32 73.002667z"/><path d="M768 85.333333a128 128 0 0 1 128 128v153.002667c22.954667 8.106667 39.893333 28.928 42.368 53.973333L938.666667 426.666667v106.666666a64 64 0 0 1-57.856 63.701334L874.666667 597.333333l-10.752 0.042667A362.752 362.752 0 0 1 533.333333 810.666667h-42.666666a362.752 362.752 0 0 1-330.581334-213.290667L149.333333 597.333333A64 64 0 0 1 85.333333 533.333333V426.666667a64 64 0 0 1 52.48-62.976A362.794667 362.794667 0 0 1 490.666667 85.333333H768z m-234.154667 99.541334h-42.666666a266.666667 266.666667 0 0 0-9.813334 533.162666l9.813334 0.170667h42.666666a266.666667 266.666667 0 0 0 0-533.333333z"/><path d="M533.845333 184.874667a266.666667 266.666667 0 0 1 0 533.333333h-42.666666a266.666667 266.666667 0 1 1 0-533.333333h42.666666zM394.666667 362.666667C365.226667 362.666667 341.333333 386.56 341.333333 416v85.333333a53.333333 53.333333 0 0 0 106.666667 0v-85.333333c0-29.44-23.893333-53.333333-53.333333-53.333333z m234.666666 0c-29.44 0-53.333333 23.893333-53.333333 53.333333v85.333333a53.333333 53.333333 0 0 0 106.666667 0v-85.333333c0-29.44-23.893333-53.333333-53.333334-53.333333z"/></svg>
    </div>
    <nav id="rail-nav" class="flex flex-col items-center gap-2 pt-4"></nav>
    <div class="flex-1"></div>
    <button onclick="navigate('settings')" data-section="settings" class="rail-btn text-muted-foreground" title="设置">
      <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12.22 2h-.44a2 2 0 00-2 2v.18a2 2 0 01-1 1.73l-.43.25a2 2 0 01-2 0l-.15-.08a2 2 0 00-2.73.73l-.22.38a2 2 0 00.73 2.73l.15.1a2 2 0 011 1.72v.51a2 2 0 01-1 1.74l-.15.09a2 2 0 00-.73 2.73l.22.38a2 2 0 002.73.73l.15-.08a2 2 0 012 0l.43.25a2 2 0 011 1.73V20a2 2 0 002 2h.44a2 2 0 002-2v-.18a2 2 0 011-1.73l.43-.25a2 2 0 012 0l.15.08a2 2 0 002.73-.73l.22-.39a2 2 0 00-.73-2.73l-.15-.08a2 2 0 01-1-1.74v-.5a2 2 0 011-1.74l.15-.09a2 2 0 00.73-2.73l-.22-.38a2 2 0 00-2.73-.73l-.15.08a2 2 0 01-2 0l-.43-.25a2 2 0 01-1-1.73V4a2 2 0 00-2-2z"/>
      </svg>
    </button>
    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-xs font-semibold shrink-0 my-3 cursor-default" title="Bond Li">B</div>
  </aside>

  <!-- TASK LIST PANEL (chat view only: left list + right detail) -->
  <aside id="task-panel" class="w-64 shrink-0 bg-white border-r border-border flex-col hidden">
    <!-- Panel header: Logo icon (next to traffic lights) -->
      </div>

    <!-- New task button -->
    <div class="p-2">
      <button onclick="showNewTask()" class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg bg-primary text-primary-foreground text-sm font-medium hover:opacity-90 transition">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建任务
      </button>
    </div>

    <!-- Task list (free flat + project grouped) -->
    <div class="px-3 pb-2 overflow-y-auto flex-1 min-h-0" id="recent-tasks"></div>
  </aside>

  <!-- MAIN AREA -->
  <main class="flex-1 flex flex-col min-w-0 overflow-hidden" id="main-area"></main>
</div>

<!-- ONBOARDING MODAL -->
<div id="onboarding-modal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm items-center justify-center hidden">
  <div class="bg-white rounded-2xl w-[560px] max-w-[90vw] shadow-2xl overflow-hidden fade-in">
    <div class="px-8 py-6 border-b border-border">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-full bg-nexa text-white text-[11px] font-semibold flex items-center justify-center">1</div>
        <span class="text-xs font-medium">基本信息</span>
        <div class="w-10 h-0.5 bg-border"></div>
        <div class="w-6 h-6 rounded-full bg-muted text-muted-foreground text-[11px] font-semibold flex items-center justify-center">2</div>
        <span class="text-xs text-muted-foreground">模型配置</span>
        <div class="w-10 h-0.5 bg-border"></div>
        <div class="w-6 h-6 rounded-full bg-muted text-muted-foreground text-[11px] font-semibold flex items-center justify-center">3</div>
        <span class="text-xs text-muted-foreground">偏好</span>
      </div>
    </div>
    <div id="ob-content" class="px-8 py-6">
      <h2 class="text-xl font-semibold mb-1">欢迎使用 Nexa</h2>
      <p class="text-sm text-muted-foreground mb-6">让我先认识一下你，之后就可以开始帮你干活了。</p>
      <div>
        <label class="text-sm font-medium mb-1.5 block">Nexa 怎么称呼你？</label>
        <input type="text" class="w-full border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-nexa/30" placeholder="例如: Bond" value="Bond">
      </div>
      <div class="mt-8 flex justify-end gap-2">
        <button onclick="closeOnboarding()" class="text-sm text-muted-foreground hover:text-foreground px-4 py-2">跳过</button>
        <button onclick="closeOnboarding()" class="text-sm font-medium px-5 py-2 bg-primary text-primary-foreground rounded-lg hover:opacity-90">开始使用 Nexa</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============ Router & State ============ */
/* Nav rail (Codex-style icon rail): click switches the right area */
const RAIL_NAV = [
  { id: 'chat', label: '任务', icon: '<path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/>' },
  { id: 'scheduled', label: '定时任务', icon: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>' },
  { id: 'library', label: '资料库', icon: '<path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/>' },
  { id: 'skills', label: '技能包', icon: '<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>' },
  { divider: true },
  { id: 'phonescreen', label: '手机端预览', icon: '<rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>' },
  { id: 'plugin', label: '浏览器插件', icon: '<rect width="7" height="7" x="14" y="3" rx="1"/><path d="M10 21V8a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1H3"/>' },
];

function renderRail() {
  const nav = document.getElementById('rail-nav');
  nav.innerHTML = RAIL_NAV.map(n => {
    if (n.divider) return '<div class="w-5 h-px bg-border my-0.5 shrink-0"></div>';
    return `<button onclick="navigate('${n.id}')" data-section="${n.id}" class="rail-btn text-muted-foreground" title="${n.label}">
      <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${n.icon}</svg>
    </button>`;
  }).join('');
}

/* ============ Search/Filter Popovers ============ */
let searchPopoverOpen = false;
let filterPopoverOpen = false;
function toggleSearchPopover() {
  searchPopoverOpen = !searchPopoverOpen;
  filterPopoverOpen = false;
  document.getElementById('search-popover').classList.toggle('hidden', !searchPopoverOpen);
  document.getElementById('filter-popover').classList.add('hidden');
  if (searchPopoverOpen) setTimeout(() => document.getElementById('task-search').focus(), 50);
}
function toggleFilterPopover() {
  filterPopoverOpen = !filterPopoverOpen;
  searchPopoverOpen = false;
  document.getElementById('filter-popover').classList.toggle('hidden', !filterPopoverOpen);
  document.getElementById('search-popover').classList.add('hidden');
}
function updateSearchDot() {
  const val = document.getElementById('task-search').value.trim();
  document.getElementById('search-active-dot').classList.toggle('hidden', !val);
}

/* ============ Task Filter (WorkBuddy-style: free flat + project grouped) ============ */
/* Data model: free tasks are flat; project sessions are grouped by project dir */
const ALL_TASKS = [
  // --- FREE tasks (flat, shown at top under "自由任务") ---
  { id: 't1', type: 'free', title: 'AI Agent 框架调研报告', status: 'running', time: '刚刚' },
  { id: 't2', type: 'free', title: '特斯拉股价监控脚本', status: 'completed', time: '2 小时前' },
  { id: 't3', type: 'free', title: '杭州周末两日游规划', status: 'completed', time: '昨天' },
  { id: 't4', type: 'free', title: '周报生成 - 10 月第一周', status: 'completed', time: '2 天前' },
  { id: 't5', type: 'free', title: '图片批量重命名脚本', status: 'failed', time: '3 天前' },
  { id: 't6', type: 'free', title: '飞书文档整理脚本', status: 'completed', time: '5 天前' },
  { id: 't8', type: 'free', title: 'Deepseek 模型测评', status: 'completed', time: '上周' },

  // --- PROJECT groups (sessions grouped by project dir) ---
  {
    type: 'project',
    projectPath: '/Users/bondli/projects/recipe-app',
    projectName: 'recipe-app',
    sessions: [
      { id: 't7a', title: '会员能力 - 设计方案', status: 'completed', time: '2 天前' },
      { id: 't7b', title: '会员能力 - 后端 API', status: 'completed', time: '昨天' },
      { id: 't7c', title: '会员能力 - 前端 UI 联调', status: 'running', time: '6 小时前' },
    ],
  },
  {
    type: 'project',
    projectPath: '/Users/bondli/projects/finance-tracker',
    projectName: 'finance-tracker',
    sessions: [
      { id: 't9a', title: '项目初始化 + README', status: 'completed', time: '3 天前' },
      { id: 't9b', title: '账单导入功能', status: 'running', time: '1 小时前' },
    ],
  },
];

let currentFilter = 'all';
let currentSearch = '';
// Expand state per project group: default expanded if contains running session
const GROUP_EXPANDED = {};
function initGroupExpand() {
  ALL_TASKS.forEach(g => {
    if (g.type === 'project') {
      GROUP_EXPANDED[g.projectPath] = g.sessions.some(s => s.status === 'running');
    }
  });
}
initGroupExpand();
function toggleGroup(projectPath) {
  GROUP_EXPANDED[projectPath] = !GROUP_EXPANDED[projectPath];
  renderRecentTasks();
}

/* Status dot helper */
function statusDot(status) {
  if (status === 'running') return '<span class="w-1.5 h-1.5 rounded-full bg-success animate-pulse shrink-0"></span>';
  if (status === 'failed') return '<span class="w-1.5 h-1.5 rounded-full bg-destructive shrink-0"></span>';
  if (status === 'project-paused') return '<span class="w-1.5 h-1.5 rounded-full bg-warning shrink-0"></span>';
  return '<span class="w-1.5 h-1.5 rounded-full bg-success/50 shrink-0"></span>';
}
/* Status filter check */
function matchFilter(status) {
  if (currentFilter === 'all') return true;
  if (currentFilter === 'running') return status === 'running' || status === 'project-paused';
  if (currentFilter === 'completed') return status === 'completed';
  if (currentFilter === 'failed') return status === 'failed';
  return true;
}
/* Search check */
function matchSearch(text) {
  if (!currentSearch) return true;
  return text.toLowerCase().includes(currentSearch.toLowerCase());
}

function renderRecentTasks() {
  const el = document.getElementById('recent-tasks');

  // Split into free filtered & project groups with filtered sessions
  const freeFiltered = [];
  const projectGroups = [];

  for (const g of ALL_TASKS) {
    if (g.type === 'free') {
      if (!matchFilter(g.status)) continue;
      if (!matchSearch(g.title)) continue;
      freeFiltered.push(g);
    } else {
      // project group: keep group if projectName matches search OR any session passes
      const matchingSessions = g.sessions.filter(s => matchFilter(s.status) && matchSearch(s.title));
      const groupNameMatch = matchSearch(g.projectName);
      if (matchingSessions.length === 0 && !groupNameMatch) continue;
      // if search matches projectName directly but no individual session, show all sessions in that group
      const sessionsToShow = groupNameMatch && matchingSessions.length === 0 ? g.sessions.filter(s => matchFilter(s.status)) : matchingSessions;
      if (sessionsToShow.length === 0) continue;
      const expanded = GROUP_EXPANDED[g.projectPath] ?? true;
      const runningCount = sessionsToShow.filter(s => s.status === 'running').length;
      const groupFiltered = { ...g, sessions: sessionsToShow, _expanded: expanded, _runningCount: runningCount };
      projectGroups.push(groupFiltered);
      // auto-expand if search hit or has running
      if (currentSearch || runningCount > 0) GROUP_EXPANDED[g.projectPath] = true;
    }
  }

  const totalCount = freeFiltered.length + projectGroups.reduce((s, g) => s + g.sessions.length, 0);
  if (totalCount === 0) {
    el.innerHTML = `<div class="text-[11px] text-muted-foreground text-center py-6">没有匹配的任务</div>`;
    return;
  }

  let html = '';

  // --- FREE section ---
  if (freeFiltered.length > 0) {
    html += `<div class="px-2 pt-1 pb-0.5 text-[10px] font-semibold tracking-wider text-muted-foreground uppercase sidebar-text">自由任务</div>`;
    html += freeFiltered.map(t => {
      const active = t.id === 't1';
      return `<button onclick="loadTask()" class="w-full text-left px-2 py-1.5 rounded-md ${active ? 'bg-secondary' : 'hover:bg-accent'} transition">
        <div class="flex items-center gap-1.5">
          ${statusDot(t.status)}
          <span class="text-[12px] truncate flex-1 leading-tight sidebar-text">${t.title}</span>
        </div>
        <div class="text-[10px] text-muted-foreground ml-3 mt-0.5 sidebar-text">${t.time}</div>
      </button>`;
    }).join('');
  }

  // --- PROJECT groups ---
  for (const g of projectGroups) {
    html += `<div class="mt-1.5">
      <button onclick="toggleGroup('${g.projectPath}')" class="w-full flex items-center gap-1.5 px-2 py-1 rounded-md hover:bg-accent transition text-left">
        <svg class="w-2.5 h-2.5 text-muted-foreground transition-transform shrink-0 ${g._expanded ? '' : '-rotate-90'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        <svg class="w-3 h-3 text-amber-500 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        <span class="text-[12px] font-medium truncate flex-1 leading-tight sidebar-text">${g.projectName}</span>
        <span class="text-[10px] text-muted-foreground bg-muted px-1.5 rounded sidebar-text">${g.sessions.length}</span>
        ${g._runningCount > 0 ? '<span class="w-1.5 h-1.5 rounded-full bg-success animate-pulse shrink-0"></span>' : ''}
      </button>`;
    if (g._expanded) {
      html += g.sessions.map((s, i) => {
        const active = s.id === 't7c';
        const chevron = i === g.sessions.length - 1 ? '│' : '│';
        return `<button onclick="loadTask()" class="w-full text-left pl-5 pr-2 py-1 rounded-md ${active ? 'bg-secondary' : 'hover:bg-accent'} transition flex items-center gap-1.5">
          <span class="w-2 h-px bg-border shrink-0"></span>
          ${statusDot(s.status)}
          <span class="text-[11.5px] truncate flex-1 leading-tight sidebar-text">${s.title}</span>
          <span class="text-[10px] text-muted-foreground shrink-0 sidebar-text">${s.time}</span>
        </button>`;
      }).join('');
    }
    html += `</div>`;
  }

  el.innerHTML = html;
}

function filterTasks() {
  currentSearch = document.getElementById('task-search').value.trim();
  renderRecentTasks();
}
function clearSearch() {
  document.getElementById('task-search').value = '';
  filterTasks();
}
function setTaskFilter(f) {
  currentFilter = f;
  ['all','running','completed','failed'].forEach(k => {
    const btn = document.getElementById('filter-' + k);
    if (!btn) return;
    if (k === f) btn.className = 'text-[11px] px-2.5 py-1 rounded-full border bg-nexa/10 text-nexa border-nexa/30 font-medium';
    else btn.className = 'text-[11px] px-2.5 py-1 rounded-full border border-border hover:bg-secondary text-muted-foreground';
  });
  renderRecentTasks();
}

let currentSection = 'chat';
function navigate(section) {
  currentSection = section;
  // rail 图标高亮
  document.querySelectorAll('.rail-btn[data-section]').forEach(b => {
    const isActive = b.dataset.section === section;
    b.classList.toggle('bg-secondary', isActive);
    b.classList.toggle('text-secondary-foreground', isActive);
    b.classList.toggle('text-muted-foreground', !isActive);
  });
  // 任务列表面板仅在任务视图显示（左列表 + 右详情分栏）
  const panel = document.getElementById('task-panel');
  panel.classList.toggle('hidden', section !== 'chat');
  panel.classList.toggle('flex', section === 'chat');
  renderSection();
}
function showNewTask() { chatEmpty = true; navigate('chat'); }
function loadTask() { chatEmpty = false; navigate('chat'); }

function renderSection() {

function renderMessage(m) {

  if (m.type === 'assistant') {
    const c = m.content.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
    return `<div class="flex gap-3 fade-in">${av}<div class="flex-1 bg-white border border-border rounded-xl rounded-tl-sm px-4 py-3 text-[14px] max-w-[85%] leading-relaxed">${c}</div></div>`;
  }
  if (m.type === 'expert-switch') return `<div class="flex gap-3 fade-in">${av}<div class="inline-flex items-center gap-2 bg-white border border-border rounded-full px-3 py-1 text-xs text-muted-foreground self-start">⚡ 自动切换专家 → <span class="font-medium text-foreground">${m.to}</span></div></div>`;
  if (m.type === 'plan') {
    const steps = m.steps.map(s => {
      const icon = s.status === 'done' ? '✓' : s.status === 'active' ? '◉' : '○';
      const color = s.status === 'done' ? 'text-success' : s.status === 'active' ? 'text-nexa' : 'text-muted-foreground';
      const bg = s.status === 'done' ? 'bg-success/10' : s.status === 'active' ? 'bg-nexa/10 animate-pulse' : 'bg-muted';
      const textCls = s.status === 'pending' ? 'text-muted-foreground' : 'text-foreground' + (s.status === 'active' ? ' font-medium' : '');
      return `<div class="step-line flex items-start gap-3 py-1"><div class="w-4 h-4 rounded-full ${bg} ${color} shrink-0 mt-0.5 text-[9px] font-bold flex items-center justify-center">${icon}</div><span class="text-[13px] ${textCls}">${s.text}</span></div>`;
    }).join('');
    return `<div class="flex gap-3 fade-in">${av}<div class="flex-1 max-w-[85%]"><div class="flex items-center gap-2 mb-1"><span class="text-xs font-semibold text-nexa">Agent Plan</span><span class="text-xs text-muted-foreground">· 使用 <code class="font-mono text-[11px] px-1 bg-muted rounded">deep-research</code> Skill</span></div><div class="bg-white border border-border rounded-xl rounded-tl-sm px-4 py-2">${steps}</div></div></div>`;

  }
  if (m.type === 'human-ask') {
    const opts = m.options.map(o => `<button class="px-3 py-2 rounded-lg border border-border bg-white hover:bg-secondary text-sm font-medium text-left transition">${o}</button>`).join('');

function openNoteEditor(noteId) {
  const note = LIBRARY_NOTES.find(n => n.id === noteId) || {
    id: 'new-' + Date.now(),
    title: '', status: 'draft', category: '未分类', tags: [],
    updatedAt: '刚刚', content: ''
  };
  editingDraft = { ...note };
  noteEditor = noteId ? { id: noteId } : { id: editingDraft.id, isNew: true };
  renderSection();
}
function closeNoteEditor() {
  noteEditor = null;
  editingDraft = null;
  renderSection();
}
function saveNote() {
  if (!editingDraft.title.trim()) { alert('请先输入标题'); return; }
  if (noteEditor.isNew) {
    LIBRARY_NOTES.unshift({ ...editingDraft, status: 'draft', updatedAt: '刚刚' });
    noteEditor.isNew = false; // now it's an existing note
  } else {
    Object.assign(LIBRARY_NOTES.find(n => n.id === editingDraft.id), editingDraft, { updatedAt: '刚刚' });
  }
  editingDraft.updatedAt = '刚刚';
  renderSection();
}
function submitNote() {
  if (!editingDraft.title.trim()) { alert('请先输入标题'); return; }
  editingDraft.status = 'submitted';
  saveNote();
  closeNoteEditor();
}
function deleteNote() {
  if (!confirm('确定删除这条笔记？')) return;
  const idx = LIBRARY_NOTES.findIndex(n => n.id === editingDraft.id);
  if (idx >= 0) LIBRARY_NOTES.splice(idx, 1);
  closeNoteEditor();
}

            <span class="text-[11px] text-muted-foreground self-center">${n.content.length} 字符</span>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}
function toggleNotePreview() {
  const ta = document.getElementById('note-content-ta');
  const prev = document.getElementById('note-preview');
  if (prev.classList.contains('hidden')) {
    ta.classList.add('hidden');
    prev.classList.remove('hidden');
    updateEditorPreview();
  } else {
    ta.classList.remove('hidden');
    prev.classList.add('hidden');
  }
}
function updateEditorPreview() {
  const ta = document.getElementById('note-content-ta');
  const prev = document.getElementById('note-preview');
  if (!prev || !ta) return;
  const md = ta.value;
  prev.innerHTML = `<div class="prose prose-sm max-w-none text-[13.5px] leading-relaxed">${
    md.replace(/^### (.+)$/gm,'<h4 class="font-semibold mt-3 mb-1">▶ $1</h4>')
      .replace(/^## (.+)$/gm,'<h3 class="font-bold text-base mt-4 mb-2">$1</h3>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/^> (.+)$/gm,'<blockquote class="border-l-2 border-nexa/40 pl-3 text-muted-foreground italic text-xs">$1</blockquote>')
      .replace(/^_(.+)_$/gm,'<em class="text-muted-foreground">$1</em>')
      .replace(/\n/g,'<br>')
  }</div>`;
}
